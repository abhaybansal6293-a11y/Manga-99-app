<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Manga 99</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #15151d;
      --card2: #1e1e29;
      --accent: #ff6b00;
      --accent2: #ff8c00;
      --text: #ffffff;
      --muted: #9ca3af;
      --border: #2a2a38;
      --green: #10b981;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 78px; user-select: none; }
    button, input, textarea, select { font-family: inherit; outline: none; }

    /* लोडिंग (स्प्लैश) स्क्रीन - साफ और सिनेमाई */
    #splashScreen {
      position: fixed; inset: 0; z-index: 99999;
      background: radial-gradient(circle at center, #221308 0%, #09090c 75%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splashScreen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    
     .splash-ring {
      width: 118px; height: 118px; border-radius: 50%;
      border: 4px solid rgba(255, 107, 0, 0.22);
      border-top-color: var(--accent);
      animation: spinRing 1s linear infinite;
      position: absolute;
    }
    .splash-badge {
      width: 96px; height: 96px; border-radius: 26px;
      background: linear-gradient(135deg, #ff6b00, #ff3d00);
      display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -1px;
      box-shadow: 0 0 42px rgba(255, 107, 0, 0.6);
      animation: popLogo 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .splash-title {
      margin-top: 28px; font-size: 28px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(90deg, #fff, #ff9e44);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .splash-sub { margin-top: 6px; font-size: 12px; color: var(--muted); letter-spacing: 1.5px; }
    @keyframes spinRing { to { transform: rotate(360deg); } }
    @keyframes popLogo { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* टॉप हेडर और भाषा बटन */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11, 11, 15, 0.94); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    
        .brand { display: flex; align-items: center; gap: 9px; }
    .brand-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #ff3d00);
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px;
    }
    .brand-name { font-size: 18px; font-weight: 900; letter-spacing: 0.4px; }
    .brand-name span { color: var(--accent); }
    .header-actions { display: flex; align-items: center; gap: 7px; }
    .lang-pill {
      font-size: 11px; padding: 5px 10px; border-radius: 20px;
      background: var(--card2); color: #fff; border: 1px solid var(--accent);
      font-weight: 800; cursor: pointer;
    }
    .cloud-pill {
      font-size: 10px; padding: 4px 8px; border-radius: 20px;
      background: rgba(16, 185, 129, 0.14); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.35);
      font-weight: 700;
    }

    /* व्यू और कार्ड्स */
    .view { display: none; padding: 14px; max-width: 720px; margin: 0 auto; }
    .view.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .search-bar {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      color: #fff; padding: 11px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 12px;
    }
    
        .filter-tabs { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; }
    .ftab {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .ftab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.98); }
    .card img { width: 100%; height: 195px; object-fit: cover; background: #1c1c26; display: block; }
    .card-lang-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(11, 11, 15, 0.88); border: 1px solid var(--accent);
      color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px;
    }
    .card-body { padding: 10px; }
    .card-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; justify-content: space-between; align-items: center; }
    .tag { background: rgba(255, 107, 0, 0.16); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-weight: 700; font-size: 10px; }
    .empty-box {
      text-align: center; padding: 46px 18px; background: var(--card);
      border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); margin-top: 8px;
    }
    
        .empty-box h3 { color: #fff; margin-bottom: 6px; font-size: 16px; }
    .btn {
      background: var(--accent); color: #fff; border: none; padding: 10px 16px;
      border-radius: 11px; font-weight: 700; font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { opacity: 0.85; }
    .btn-dark { background: var(--card2); border: 1px solid var(--border); color: #fff; }
    .btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 9px; }
    .stat-row {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      margin: 12px 0; padding: 10px 12px; background: var(--card); border-radius: 12px; border: 1px solid var(--border);
    }
    .pill-stat {
      display: inline-flex; align-items: center; gap: 6px; background: var(--card2);
      border: 1px solid var(--border); padding: 7px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 700; color: #fff; cursor: pointer;
    }
    .pill-stat.liked { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .lang-highlight {
      background: rgba(59, 130, 246, 0.16); border: 1px solid rgba(59, 130, 246, 0.45);
      color: #93c5fd; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800;
    }
    .manga-page-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 18px; overflow: hidden; }
    .manga-page-img { width: 100%; display: block; background: #111; min-height: 220px; }
    .page-social-bar { padding: 10px 12px; background: var(--card2); display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
    .page-comments-box { padding: 10px 12px; background: #121218; border-top: 1px solid var(--border); display: none; }
    .page-comments-box.open { display: block; }
    
        /* एनिमे वीडियो प्लेयर + ऑटो लैंडस्केप फुलस्क्रीन + पूरी तरह स्क्रीन के अंदर फिट */
    .player-shell {
      position: relative; width: 100%; background: #000; border-radius: 14px;
      overflow: hidden; border: 1px solid var(--border); aspect-ratio: 16 / 9;
    }
    .player-shell video {
      width: 100%; height: 100%; object-fit: contain; background: #000; display: block;
    }
    .player-shell.fs-landscape {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 99990 !important; border-radius: 0 !important; border: none !important;
      background: #000 !important; display: flex !important; align-items: center !important; justify-content: center !important;
    }
    .player-shell.fs-landscape.force-rotate {
      width: 100vh !important; height: 100vw !important;
      top: 50% !important; left: 50% !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
    }
    .player-shell.fs-landscape video {
      width: 100% !important; height: 100% !important;
      max-width: 100% !important; max-height: 100% !important;
      object-fit: contain !important;
    }
    .tap-zone-left, .tap-zone-right {
      position: absolute; top: 0; bottom: 52px; width: 36%; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    .tap-zone-left { left: 0; }
    .tap-zone-right { right: 0; }
    .seek-badge {
      background: rgba(0, 0, 0, 0.78); color: #fff; padding: 8px 14px; border-radius: 24px;
      font-size: 13px; font-weight: 800; opacity: 0; transform: scale(0.8);
      transition: opacity 0.2s, transform 0.2s; pointer-events: none;
    }
    .seek-badge.show { opacity: 1; transform: scale(1); }
    
        .player-controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.94));
      padding: 8px 10px; display: flex; align-items: center; gap: 7px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.15); border: none; color: #fff;
      padding: 5px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .seek-slider { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
    .time-txt { font-size: 11px; color: #e5e7eb; white-space: nowrap; }
    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
      background: rgba(15, 15, 22, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 4px;
    }
    .nav-item {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 700; cursor: pointer; padding: 4px 10px;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    .input {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 14px;
    }
    .comment-item { background: var(--card2); padding: 8px 10px; border-radius: 9px; margin-bottom: 6px; font-size: 13px; }
    .comment-author { font-weight: 700; color: var(--accent); font-size: 11px; margin-bottom: 2px; }
    .toast {
      position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 99998;
      background: #1f2937; color: #fff; border: 1px solid var(--accent);
      padding: 9px 16px; border-radius: 24px; font-size: 13px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none;
    }
  </style>
</head>

<body>
  <!-- लोडिंग स्क्रीन (खुलते ही अपने आप आवाज़ बजेगी) -->
  <div id="splashScreen">
    <div class="splash-ring"></div>
    <div class="splash-badge">M99</div>
    <div class="splash-title">MANGA 99</div>
    <div class="splash-sub">MANGA • ANIME • CREATORS</div>
  </div>

  <div id="toast" class="toast"></div>

  <header>
    <div class="brand">
      <div class="brand-icon">99</div>
      <div class="brand-name">MANGA <span>99</span></div>
    </div>
    <div class="header-actions">
      <button id="appLangBtn" class="lang-pill" onclick="toggleAppLanguage()">🌐 हिंदी / EN</button>
      <div class="cloud-pill">Live ✓</div>
    </div>
  </header>

  <!-- 1. होम (मंगा सेक्शन + भाषा फ़िल्टर) -->
  <section id="view-home" class="view active">
    <input type="text" id="mangaSearch" class="search-bar" placeholder="मंगा खोजें..." oninput="renderMangaList()" />
    <div class="filter-tabs">
      <button class="ftab active" id="mfilter-all" onclick="setMangaLangFilter('all')">All / सभी</button>
      <button class="ftab" id="mfilter-Hindi" onclick="setMangaLangFilter('Hindi')">हिंदी (Hindi)</button>
      <button class="ftab" id="mfilter-English" onclick="setMangaLangFilter('English')">English</button>
    </div>
    <div id="mangaGrid" class="grid"></div>
  </section>

  <!-- 2. मंगा रीडर और प्रोफाइल डिटेल (भाषा बैज + असली व्यूज + हर पेज पर लाइक व कमेंट) -->
  <section id="view-reader" class="view">
    <button class="btn btn-dark btn-sm" id="btnBackManga" onclick="playSound('back'); switchView('home')">← वापस जाएं</button>
    <div id="readerHeader" style="margin-top:12px;"></div>
    <div class="stat-row" id="mangaStatsRow"></div>
    <div id="readerPagesContainer" style="margin-top:12px;"></div>
  </section>
    <!-- 3. एनिमे सेक्शन (भाषा फ़िल्टर + सीरीज़ कार्ड के ऊपर भाषा बैज) -->
  <section id="view-anime" class="view">
    <input type="text" id="animeSearch" class="search-bar" placeholder="एनिमे सीरीज़ खोजें..." oninput="renderAnimeList()" />
    <div class="filter-tabs">
      <button class="ftab active" id="afilter-all" onclick="setAnimeLangFilter('all')">All / सभी</button>
      <button class="ftab" id="afilter-Hindi" onclick="setAnimeLangFilter('Hindi')">हिंदी (Hindi)</button>
      <button class="ftab" id="afilter-English" onclick="setAnimeLangFilter('English')">English</button>
    </div>
    <div id="animeGrid" class="grid"></div>
  </section>

  <!-- 4. एनिमे वीडियो प्लेयर और सीरीज़ प्रोफाइल (एपिसोड भाषा बैज + ऑटो लैंडस्केप फुलस्क्रीन + -10s/+10s) -->
  <section id="view-watch" class="view">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px;">
      <button class="btn btn-dark btn-sm" id="btnBackAnime" onclick="playSound('back'); closeAnimePlayer()">← वापस</button>
      <select id="seasonSelect" class="input" style="width:auto; padding:6px 10px; font-size:12px;" onchange="playSound('nav'); changeSeasonFilter()"></select>
    </div>

    <div id="playerShell" class="player-shell">
      <video id="animeVideo" playsinline preload="metadata"></video>
      <div class="tap-zone-left" onclick="handleVideoTap(event, -10)">
        <div id="badgeLeft" class="seek-badge">⏪ 10s</div>
      </div>
      <div class="tap-zone-right" onclick="handleVideoTap(event, 10)">
        <div id="badgeRight" class="seek-badge">10s ⏩</div>
      </div>
      <div class="player-controls" onclick="event.stopPropagation()">
        <button class="ctrl-btn" id="playPauseBtn" onclick="togglePlayPause()">▶</button>
        <button class="ctrl-btn" onclick="seekRelative(-10)">⏪ 10s</button>
        <button class="ctrl-btn" onclick="seekRelative(10)">10s ⏩</button>
        <input type="range" id="seekBar" class="seek-slider" min="0" max="100" value="0" oninput="manualSeek(this.value)" />
        <span id="timeDisplay" class="time-txt">00:00</span>
        <button class="ctrl-btn" id="fsBtn" onclick="toggleLandscapeFullscreen()">⛶ Full</button>
      </div>
    </div>
    
        <!-- एनिमे प्रोफाइल कार्ड (यहाँ भी साफ़ दिखेगा कि वीडियो किस भाषा में है) -->
    <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
        <h3 id="watchEpTitle" style="font-size:15px;"></h3>
        <span id="watchEpLangBadge" class="lang-highlight">Hindi</span>
      </div>
      <p id="watchSeriesMeta" style="font-size:12px; color:var(--muted); margin-top:4px;"></p>
    </div>

    <div class="stat-row" id="animeStatsRow"></div>
    <div id="episodeList" style="display:flex; gap:8px; flex-wrap:wrap; margin:12px 0;"></div>

    <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:12px;">
      <h4 id="lblComments" style="font-size:14px; margin-bottom:8px;">कमेंट्स</h4>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <input type="text" id="animeCommentInput" class="input" placeholder="अपना कमेंट लिखें..." />
        <button class="btn btn-sm" id="btnSendComment" onclick="postAnimeComment()">भेजें</button>
      </div>
      <div id="animeCommentsList"></div>
    </div>
  </section>

  <!-- 5. अपनी मंगा अपलोड करें (भाषा चयन के साथ) -->
  <section id="view-publish" class="view">
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;">
      <h3 id="lblPubHeading" style="margin-bottom:4px;">अपनी मंगा अपलोड करें</h3>
      <p id="lblPubSub" style="font-size:12px; color:var(--muted); margin-bottom:14px;">अपनी खुद की हिंदी या इंग्लिश मंगा लाइव करें।</p>
      <div class="form-group">
        <label id="lblMangaTitle">मंगा का नाम (Title)</label>
        <input type="text" id="pubTitle" class="input" placeholder="उदाहरण: द लास्ट वॉरियर" />
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <div class="form-group">
          <label id="lblMangaLang">मंगा की भाषा</label>
          <select id="pubLang" class="input">
            <option value="Hindi">हिंदी (Hindi)</option>
            <option value="English">English</option>
          </select>
        </div>
        <div class="form-group">
          <label id="lblMangaGenre">कैटेगरी (Genre)</label>
          <input type="text" id="pubGenre" class="input" placeholder="Action / Fantasy" />
        </div>
      </div>
      <div class="form-group">
        <label id="lblMangaCover">कवर फोटो चुनें</label>
        <input type="file" id="pubCover" class="input" accept="image/*" />
      </div>
      <div class="form-group">
        <label id="lblMangaPages">मंगा के पन्ने चुनें</label>
        <input type="file" id="pubPages" class="input" accept="image/*" multiple />
      </div>
      <button class="btn" id="btnPubManga" style="width:100%;" onclick="publishNewManga()">मंगा पब्लिश करें 🚀</button>
    </div>
  </section>
  
    <!-- 6. प्रोफाइल (ठीक बगल में ऐप शेयर बटन + आपकी अपलोड की गई मंगा व एनिमे की भाषा सहित प्रोफाइल सूची) -->
  <section id="view-profile" class="view">
    <div style="background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:12px;">
          <div id="profileAvatar" style="width:54px; height:54px; border-radius:50%; background:linear-gradient(135deg,var(--accent),#ff3d00); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900;">U</div>
          <div>
            <h3 id="profileDisplayName" style="font-size:17px;">Reader</h3>
            <p style="font-size:12px; color:var(--muted);">Manga 99 Creator & Fan</p>
          </div>
        </div>
        <button class="btn btn-sm" id="btnShareApp" onclick="playSound('like'); shareAppWithFriends()">📤 ऐप शेयर करें</button>
      </div>

      <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:14px;">
        <div class="form-group">
          <label id="lblChangeName">अपना नाम बदलें</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="editNameInput" class="input" placeholder="नया नाम लिखें..." />
            <button class="btn btn-sm" id="btnSaveName" onclick="saveProfileName()">सेव</button>
          </div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; background:var(--card2); padding:10px 12px; border-radius:10px; margin-bottom:12px;">
          <span id="lblBtnSound" style="font-size:13px; font-weight:600;">🔊 बटन क्लिक साउंड</span>
          <button id="soundToggleBtn" class="btn btn-sm" onclick="toggleButtonSound()">ON</button>
        </div>
        <div class="form-group">
          <label id="lblPromo">🎁 प्रोमो कोड / विशेष एक्सेस</label>
          <div style="display:flex; gap:8px;">
            <input type="password" id="promoCodeInput" class="input" placeholder="कोड डालें..." />
            <button class="btn btn-dark btn-sm" id="btnApplyCode" onclick="checkPromoCode()">लागू करें</button>
          </div>
        </div>

    <script>
    // अलग सुरक्षित बास्केट और 100% फ्रेश स्टार्ट (कोई पुराना डेटा नहीं)
    const PANTRY_ID = "d3995452-8c68-42c2-96d8-7b3a17284086";
    const MANGA_DB_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/manga99_manga_v3`;
    const ANIME_DB_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/manga99_anime_v3`;
    const STATS_DB_URL = `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/manga99_stats_v3`;

    if (!localStorage.getItem('m99_clean_v3')) {
      localStorage.clear();
      localStorage.setItem('m99_clean_v3', 'true');
    }

    let deviceId = localStorage.getItem('m99_device_id');
    if (!deviceId) {
      deviceId = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('m99_device_id', deviceId);
    }
    let userName = localStorage.getItem('m99_username') || ('Reader_' + deviceId.slice(2, 6).toUpperCase());
    let appLang = localStorage.getItem('m99_app_lang') || 'hi';
    let soundEnabled = localStorage.getItem('m99_sound') !== 'off';
    let viewedItems = JSON.parse(localStorage.getItem('m99_viewed_items') || '{}');

    let mangaList = [];
    let animeList = [];
    let statsData = {
      mangaViews: {}, mangaLikes: {},
      pageLikes: {}, pageComments: {},
      animeViews: {}, animeLikes: {}, animeComments: {}
    };

    let currentManga = null;
    let currentSeries = null;
    let currentSeason = 1;
    let currentEpisode = null;
    let mangaLangFilter = 'all';
    let animeLangFilter = 'all';
    let lastCloudFetch = 0;

    // वेब ऑडियो साउंड इंजन (लोडिंग ऑटो-साउंड + हर बटन पर अलग आवाज़)
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playStartupSound() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(115, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.55);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.15);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.9);
      } catch (e) {}
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'nav') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(680, now + 0.06);
          gain.gain.setValueAtTime(0.09, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        } else if (type === 'like') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(980, now + 0.12);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        } else if (type === 'play') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(260, now); osc.frequency.exponentialRampToValueAtTime(540, now + 0.16);
          gain.gain.setValueAtTime(0.13, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        } else {
          osc.type = 'sine'; osc.frequency.setValueAtTime(380, now); osc.frequency.exponentialRampToValueAtTime(240, now + 0.06);
          gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        }
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.2);
      } catch (e) {}
    }
    
        window.addEventListener('DOMContentLoaded', () => {
      playStartupSound();
      document.addEventListener('pointerdown', () => { getAudioCtx(); }, { once: true });
      applyAppLanguage();
      updateProfileUI();
      loadAllData(true);
      setTimeout(() => { document.getElementById('splashScreen').classList.add('hide'); }, 1700);
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 2600);
    }

    // पूरे ऐप की भाषा बदलने का टॉगल (हिंदी / English)
    function toggleAppLanguage() {
      playSound('nav');
      appLang = appLang === 'hi' ? 'en' : 'hi';
      localStorage.setItem('m99_app_lang', appLang);
      applyAppLanguage();
      renderMangaList();
      renderAnimeList();
      updateProfileUI();
    }

    function applyAppLanguage() {
      const isHi = appLang === 'hi';
      document.getElementById('appLangBtn').textContent = isHi ? '🌐 हिंदी ⇄ EN' : '🌐 EN ⇄ हिंदी';
      document.getElementById('mangaSearch').placeholder = isHi ? 'मंगा खोजें...' : 'Search Manga...';
      document.getElementById('animeSearch').placeholder = isHi ? 'एनिमे सीरीज़ खोजें...' : 'Search Anime Series...';
      document.getElementById('navTxtManga').textContent = isHi ? 'मंगा' : 'Manga';
      document.getElementById('navTxtAnime').textContent = isHi ? 'एनिमे' : 'Anime';
      document.getElementById('navTxtUpload').textContent = isHi ? 'अपलोड' : 'Upload';
      document.getElementById('navTxtProfile').textContent = isHi ? 'प्रोफाइल' : 'Profile';
      document.getElementById('btnBackManga').textContent = isHi ? '← वापस जाएं' : '← Back';
      document.getElementById('btnBackAnime').textContent = isHi ? '← वापस' : '← Back';
      document.getElementById('btnShareApp').textContent = isHi ? '📤 ऐप शेयर करें' : '📤 Share App';
      document.getElementById('lblPubHeading').textContent = isHi ? 'अपनी मंगा अपलोड करें' : 'Upload Your Manga';
      document.getElementById('lblPubSub').textContent = isHi ? 'अपनी खुद की हिंदी या इंग्लिश मंगा लाइव करें।' : 'Publish your own Hindi or English manga live.';
      document.getElementById('btnPubManga').textContent = isHi ? 'मंगा पब्लिश करें 🚀' : 'Publish Manga 🚀';
      document.getElementById('lblComments').textContent = isHi ? 'कमेंट्स' : 'Comments';
      document.getElementById('btnSendComment').textContent = isHi ? 'भेजें' : 'Send';
      document.getElementById('lblProfileLibrary').textContent = isHi ? '📚 मंगा और एनिमे लाइब्रेरी (भाषा सहित)' : '📚 Manga & Anime Library (With Language)';
    }

    // 5,000+ यूज़र्स एंटी-क्रैश स्मार्ट कैशिंग व अलग बास्केट सिंक
    async function loadAllData(force = false) {
      const now = Date.now();
      if (!force && now - lastCloudFetch < 15000) return;
      lastCloudFetch = now;
      try {
        const lm = JSON.parse(localStorage.getItem('m99_manga_cache_v3') || '[]');
        const la = JSON.parse(localStorage.getItem('m99_anime_cache_v3') || '[]');
        const ls = JSON.parse(localStorage.getItem('m99_stats_cache_v3') || 'null');
        if (lm.length) mangaList = lm;
        if (la.length) animeList = la;
        if (ls) statsData = { ...statsData, ...ls };
        renderMangaList(); renderAnimeList(); updateProfileUI();
      } catch (e) {}

      try {
        const [rM, rA, rS] = await Promise.all([
          fetch(MANGA_DB_URL).catch(() => null),
          fetch(ANIME_DB_URL).catch(() => null),
          fetch(STATS_DB_URL).catch(() => null)
        ]);
        if (rM && rM.ok) {
          const dm = await rM.json();
          if (Array.isArray(dm.items)) { mangaList = dm.items; localStorage.setItem('m99_manga_cache_v3', JSON.stringify(mangaList)); }
        }
        if (rA && rA.ok) {
          const da = await rA.json();
          if (Array.isArray(da.anime)) { animeList = da.anime; localStorage.setItem('m99_anime_cache_v3', JSON.stringify(animeList)); }
        }
        if (rS && rS.ok) {
          const ds = await rS.json();
          statsData = { ...statsData, ...ds };
          localStorage.setItem('m99_stats_cache_v3', JSON.stringify(statsData));
        }
        renderMangaList(); renderAnimeList(); updateProfileUI();
      } catch (e) {}
    }

    async function saveMangaCloud() {
      localStorage.setItem('m99_manga_cache_v3', JSON.stringify(mangaList));
      await fetch(MANGA_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: mangaList }) }).catch(() => {});
    }
    async function saveAnimeCloud() {
      localStorage.setItem('m99_anime_cache_v3', JSON.stringify(animeList));
      await fetch(ANIME_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ anime: animeList }) }).catch(() => {});
    }
    async function saveStatsCloud() {
      localStorage.setItem('m99_stats_cache_v3', JSON.stringify(statsData));
      await fetch(STATS_DB_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(statsData) }).catch(() => {});
    }
    
        function switchView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const navBtn = document.getElementById('nav-' + name);
      if (navBtn) navBtn.classList.add('active');
      if (name === 'profile') updateProfileUI();
      window.scrollTo(0, 0);
    }

    // 100% असली इंसानी व्यूज (0 से शुरू)
    function registerHumanView(type, id) {
      const key = type + '_' + id;
      if (viewedItems[key]) return;
      viewedItems[key] = true;
      localStorage.setItem('m99_viewed_items', JSON.stringify(viewedItems));
      if (type === 'manga') statsData.mangaViews[id] = (statsData.mangaViews[id] || 0) + 1;
      else statsData.animeViews[id] = (statsData.animeViews[id] || 0) + 1;
      saveStatsCloud();
    }

    function setMangaLangFilter(lang) {
      playSound('nav');
      mangaLangFilter = lang;
      document.querySelectorAll('[id^="mfilter-"]').forEach(b => b.classList.remove('active'));
      document.getElementById('mfilter-' + lang).classList.add('active');
      renderMangaList();
    }

    function renderMangaList() {
      const q = (document.getElementById('mangaSearch').value || '').toLowerCase();
      const grid = document.getElementById('mangaGrid');
      const filtered = mangaList.filter(m => {
        const matchQ = (m.title || '').toLowerCase().includes(q);
        const matchL = mangaLangFilter === 'all' || (m.lang || 'Hindi') === mangaLangFilter;
        return matchQ && matchL;
      });
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column:1/-1;"><h3>${appLang === 'hi' ? 'अभी कोई मंगा नहीं है' : 'No Manga Yet'}</h3><p>${appLang === 'hi' ? 'नीचे "अपलोड" टैब से अपनी पहली मंगा डालें!' : 'Upload your first manga from the Upload tab!'}</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(m => {
        const views = statsData.mangaViews[m.id] || 0;
        const likes = (statsData.mangaLikes[m.id] || []).length;
        const langTag = m.lang || 'Hindi';
        return `
          <div class="card" onclick="playSound('play'); openMangaReader('${m.id}')">
            <span class="card-lang-badge">🌐 ${langTag}</span>
            <img loading="lazy" src="${m.cover}" alt="${m.title}" />
            <div class="card-body">
              <div class="card-title">${m.title}</div>
              <div class="card-meta">
                <span class="tag">${m.genre || 'Manga'}</span>
                <span>👁️ ${views} • ❤️ ${likes}</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function openMangaReader(id) {
      currentManga = mangaList.find(m => m.id === id);
      if (!currentManga) return;
      registerHumanView('manga', id);
      switchView('reader');
      const langTag = currentManga.lang || 'Hindi';
      document.getElementById('readerHeader').innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
          <h2>${currentManga.title}</h2>
          <span class="lang-highlight">🌐 ${langTag}</span>
        </div>
        <p style="font-size:12px; color:var(--muted); margin-top:4px;">Creator: ${currentManga.author || 'Creator'} • ${currentManga.genre || 'Manga'}</p>`;
      renderMangaStats();

      const container = document.getElementById('readerPagesContainer');
      container.innerHTML = (currentManga.pages || []).map((src, idx) => {
        const pKey = `${currentManga.id}_p${idx}`;
        const pLikes = statsData.pageLikes[pKey] || [];
        const isLiked = pLikes.includes(deviceId);
        const pComms = statsData.pageComments[pKey] || [];
        return `
          <div class="manga-page-wrap">
            <img class="manga-page-img" loading="lazy" src="${src}" alt="Page ${idx + 1}" />
            <div class="page-social-bar">
              <span style="font-size:12px; color:var(--muted); font-weight:700;">Page ${idx + 1}</span>
              <div style="display:flex; gap:8px;">
                <button class="pill-stat ${isLiked ? 'liked' : ''}" style="padding:5px 10px; font-size:12px;" onclick="togglePageLike('${pKey}')">❤️ ${pLikes.length}</button>
                <button class="pill-stat" style="padding:5px 10px; font-size:12px;" onclick="playSound('nav'); document.getElementById('cbox_${pKey}').classList.toggle('open')">💬 ${pComms.length}</button>
              </div>
            </div>
            <div id="cbox_${pKey}" class="page-comments-box">
              <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input type="text" id="cinp_${pKey}" class="input" style="padding:7px 10px; font-size:12px;" placeholder="Comment..." />
                <button class="btn btn-sm" onclick="addPageComment('${pKey}')">Post</button>
              </div>
              <div>${pComms.map(c => `<div class="comment-item"><div class="comment-author">${c.user}</div><div>${c.text}</div></div>`).join('')}</div>
            </div>
          </div>`;
      }).join('');
    }

    function renderMangaStats() {
      const views = statsData.mangaViews[currentManga.id] || 0;
      const likesArr = statsData.mangaLikes[currentManga.id] || [];
      const liked = likesArr.includes(deviceId);
      document.getElementById('mangaStatsRow').innerHTML = `
        <button class="pill-stat ${liked ? 'liked' : ''}" onclick="toggleMangaLike()">❤️ ${likesArr.length} Likes</button>
        <div class="pill-stat" style="cursor:default;">👁️ ${views} Views</div>`;
    }

    function toggleMangaLike() {
      playSound('like');
      const id = currentManga.id;
      if (!statsData.mangaLikes[id]) statsData.mangaLikes[id] = [];
      const i = statsData.mangaLikes[id].indexOf(deviceId);
      if (i === -1) statsData.mangaLikes[id].push(deviceId);
      else statsData.mangaLikes[id].splice(i, 1);
      renderMangaStats(); saveStatsCloud();
    }

    function togglePageLike(pKey) {
      playSound('like');
      if (!statsData.pageLikes[pKey]) statsData.pageLikes[pKey] = [];
      const i = statsData.pageLikes[pKey].indexOf(deviceId);
      if (i === -1) statsData.pageLikes[pKey].push(deviceId);
      else statsData.pageLikes[pKey].splice(i, 1);
      saveStatsCloud(); openMangaReader(currentManga.id);
    }

    function addPageComment(pKey) {
      const inp = document.getElementById('cinp_' + pKey);
      const txt = (inp.value || '').trim();
      if (!txt) return;
      playSound('like');
      if (!statsData.pageComments[pKey]) statsData.pageComments[pKey] = [];
      statsData.pageComments[pKey].unshift({ user: userName, text: txt });
      saveStatsCloud(); openMangaReader(currentManga.id);
      setTimeout(() => { const box = document.getElementById('cbox_' + pKey); if (box) box.classList.add('open'); }, 50);
    }

    function compressImage(file, maxW = 850, quality = 0.72) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function publishNewManga() {
      const title = document.getElementById('pubTitle').value.trim();
      const lang = document.getElementById('pubLang').value || 'Hindi';
      const genre = document.getElementById('pubGenre').value.trim() || 'Manga';
      const coverFile = document.getElementById('pubCover').files[0];
      const pageFiles = Array.from(document.getElementById('pubPages').files || []);
      if (!title || !coverFile || !pageFiles.length) { showToast('कृपया नाम, कवर और पेज चुनें!'); return; }
      playSound('play'); showToast('अपलोड हो रहा है...');
      const cover = await compressImage(coverFile, 500, 0.72);
      const pages = [];
      for (const f of pageFiles) pages.push(await compressImage(f, 900, 0.75));
      mangaList.unshift({ id: 'm_' + Date.now(), title, lang, genre, author: userName, cover, pages });
      await saveMangaCloud();
      document.getElementById('pubTitle').value = ''; document.getElementById('pubCover').value = ''; document.getElementById('pubPages').value = '';
      showToast('मंगा लाइव हो गई है! 🎉'); renderMangaList(); switchView('home');
    }
    
        // एनिमे लिस्ट, सीरीज़ प्रोफाइल भाषा बैज, ऑटो लैंडस्केप फुलस्क्रीन व -10s/+10s
    function setAnimeLangFilter(lang) {
      playSound('nav');
      animeLangFilter = lang;
      document.querySelectorAll('[id^="afilter-"]').forEach(b => b.classList.remove('active'));
      document.getElementById('afilter-' + lang).classList.add('active');
      renderAnimeList();
    }

    function renderAnimeList() {
      const q = (document.getElementById('animeSearch').value || '').toLowerCase();
      const grid = document.getElementById('animeGrid');
      const filtered = animeList.filter(a => {
        const matchQ = (a.title || '').toLowerCase().includes(q);
        const langs = (a.episodes || []).map(e => e.lang || 'Hindi');
        const matchL = animeLangFilter === 'all' || langs.includes(animeLangFilter);
        return matchQ && matchL;
      });
      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-box" style="grid-column:1/-1;"><h3>${appLang === 'hi' ? 'अभी कोई एनिमे नहीं है' : 'No Anime Yet'}</h3><p>${appLang === 'hi' ? 'जल्द ही नए हिंदी और इंग्लिश एनिमे एपिसोड जोड़े जाएंगे।' : 'New Hindi & English anime episodes coming soon.'}</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(a => {
        const langs = [...new Set((a.episodes || []).map(e => e.lang || 'Hindi'))].join(' / ');
        return `
          <div class="card" onclick="playSound('play'); openAnimeSeries('${a.id}')">
            <span class="card-lang-badge">🌐 ${langs}</span>
            <img loading="lazy" src="${a.poster || ''}" alt="${a.title}" />
            <div class="card-body">
              <div class="card-title">${a.title}</div>
              <div class="card-meta">
                <span class="tag">${langs}</span>
                <span>${(a.episodes || []).length} Eps</span>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function openAnimeSeries(seriesId) {
      currentSeries = animeList.find(a => a.id === seriesId);
      if (!currentSeries || !currentSeries.episodes.length) return;
      switchView('watch');
      const seasons = [...new Set(currentSeries.episodes.map(e => e.season || 1))].sort((a, b) => a - b);
      const sel = document.getElementById('seasonSelect');
      sel.innerHTML = seasons.map(s => `<option value="${s}">Season ${s}</option>`).join('');
      currentSeason = seasons[0]; sel.value = currentSeason;
      renderEpisodeButtons();
      const firstEp = currentSeries.episodes.find(e => (e.season || 1) == currentSeason) || currentSeries.episodes[0];
      playEpisode(firstEp.id);
    }

    function changeSeasonFilter() {
      currentSeason = Number(document.getElementById('seasonSelect').value);
      renderEpisodeButtons();
      const ep = currentSeries.episodes.find(e => (e.season || 1) == currentSeason);
      if (ep) playEpisode(ep.id);
    }

    function renderEpisodeButtons() {
      const eps = currentSeries.episodes.filter(e => (e.season || 1) == currentSeason);
      document.getElementById('episodeList').innerHTML = eps.map(ep => `
        <button class="btn ${currentEpisode && currentEpisode.id === ep.id ? '' : 'btn-dark'} btn-sm"
          onclick="playSound('play'); playEpisode('${ep.id}')">
          Ep ${ep.epNum} (${ep.lang || 'Hindi'})
        </button>`).join('');
    }

    function playEpisode(epId) {
      currentEpisode = currentSeries.episodes.find(e => e.id === epId);
      if (!currentEpisode) return;
      registerHumanView('anime', epId);
      renderEpisodeButtons();
      const epLang = currentEpisode.lang || 'Hindi';
      document.getElementById('watchEpTitle').textContent = `${currentSeries.title} • S${currentEpisode.season} Ep${currentEpisode.epNum}: ${currentEpisode.title}`;
      document.getElementById('watchEpLangBadge').textContent = `🌐 ${epLang}`;
      document.getElementById('watchSeriesMeta').textContent = `Series: ${currentSeries.title} • Audio Language: ${epLang}`;

      const vid = document.getElementById('animeVideo');
      vid.pause(); vid.src = currentEpisode.url; vid.load(); vid.play().catch(() => {});
      document.getElementById('playPauseBtn').textContent = '⏸';
      renderAnimeStats(); renderAnimeComments();
    }

    function closeAnimePlayer() {
      exitLandscapeFullscreen();
      const vid = document.getElementById('animeVideo');
      vid.pause(); vid.removeAttribute('src'); vid.load();
      switchView('anime');
    }

    const videoEl = document.getElementById('animeVideo');
    videoEl.addEventListener('timeupdate', () => {
      if (!videoEl.duration) return;
      document.getElementById('seekBar').value = (videoEl.currentTime / videoEl.duration) * 100;
      const m = Math.floor(videoEl.currentTime / 60);
      const s = Math.floor(videoEl.currentTime % 60).toString().padStart(2, '0');
      document.getElementById('timeDisplay').textContent = `${m}:${s}`;
    });

    function togglePlayPause() {
      playSound('nav');
      if (videoEl.paused) { videoEl.play(); document.getElementById('playPauseBtn').textContent = '⏸'; }
      else { videoEl.pause(); document.getElementById('playPauseBtn').textContent = '▶'; }
    }

    function manualSeek(val) { if (videoEl.duration) videoEl.currentTime = (val / 100) * videoEl.duration; }

    function seekRelative(sec) {
      playSound('nav');
      if (!videoEl.duration) return;
      videoEl.currentTime = Math.max(0, Math.min(videoEl.duration, videoEl.currentTime + sec));
      const badge = document.getElementById(sec < 0 ? 'badgeLeft' : 'badgeRight');
      badge.classList.add('show'); clearTimeout(badge._t);
      badge._t = setTimeout(() => badge.classList.remove('show'), 550);
    }

    let lastTapTime = 0;
    function handleVideoTap(e, sec) {
      const now = Date.now();
      if (now - lastTapTime < 320) seekRelative(sec);
      lastTapTime = now;
    }

    async function toggleLandscapeFullscreen() {
      playSound('play');
      const shell = document.getElementById('playerShell');
      if (!shell.classList.contains('fs-landscape')) {
        shell.classList.add('fs-landscape');
        document.getElementById('fsBtn').textContent = '✕ Exit';
        let lockedNative = false;
        try {
          if (shell.requestFullscreen) await shell.requestFullscreen();
          else if (shell.webkitRequestFullscreen) await shell.webkitRequestFullscreen();
          if (screen.orientation && screen.orientation.lock) { await screen.orientation.lock('landscape'); lockedNative = true; }
        } catch (err) {}
        if (!lockedNative && window.innerHeight > window.innerWidth) shell.classList.add('force-rotate');
      } else {
        exitLandscapeFullscreen();
      }
    }

    function exitLandscapeFullscreen() {
      const shell = document.getElementById('playerShell');
      shell.classList.remove('fs-landscape', 'force-rotate');
      document.getElementById('fsBtn').textContent = '⛶ Full';
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch (e) {}
    }

    function renderAnimeStats() {
      const id = currentEpisode.id;
      const views = statsData.animeViews[id] || 0;
      const likesArr = statsData.animeLikes[id] || [];
      const liked = likesArr.includes(deviceId);
      document.getElementById('animeStatsRow').innerHTML = `
        <button class="pill-stat ${liked ? 'liked' : ''}" onclick="toggleAnimeLike()">❤️ ${likesArr.length} Likes</button>
        <div class="pill-stat" style="cursor:default;">👁️ ${views} Views</div>`;
    }

    function toggleAnimeLike() {
      playSound('like');
      const id = currentEpisode.id;
      if (!statsData.animeLikes[id]) statsData.animeLikes[id] = [];
      const i = statsData.animeLikes[id].indexOf(deviceId);
      if (i === -1) statsData.animeLikes[id].push(deviceId);
      else statsData.animeLikes[id].splice(i, 1);
      renderAnimeStats(); saveStatsCloud();
    }

    function renderAnimeComments() {
      const list = statsData.animeComments[currentEpisode.id] || [];
      document.getElementById('animeCommentsList').innerHTML = list.length
        ? list.map(c => `<div class="comment-item"><div class="comment-author">${c.user}</div><div>${c.text}</div></div>`).join('')
        : `<p style="font-size:12px; color:var(--muted);">No comments yet...</p>`;
    }

    function postAnimeComment() {
      const inp = document.getElementById('animeCommentInput');
      const txt = (inp.value || '').trim();
      if (!txt || !currentEpisode) return;
      playSound('like');
      const id = currentEpisode.id;
      if (!statsData.animeComments[id]) statsData.animeComments[id] = [];
      statsData.animeComments[id].unshift({ user: userName, text: txt });
      inp.value = ''; renderAnimeComments(); saveStatsCloud();
    }

    // प्रोफाइल में मंगा और एनिमे की भाषा सहित सूची + शेयर व एडमिन 2010
    function updateProfileUI() {
      document.getElementById('profileDisplayName').textContent = userName;
      document.getElementById('profileAvatar').textContent = userName.charAt(0).toUpperCase();
      document.getElementById('soundToggleBtn').textContent = soundEnabled ? 'ON' : 'OFF';

      const box = document.getElementById('profileContentList');
      const mRows = mangaList.map(m => `<div class="comment-item" style="display:flex;justify-content:space-between;align-items:center;"><span>📖 ${m.title}</span><span class="tag">🌐 ${m.lang || 'Hindi'}</span></div>`);
      const aRows = [];
      animeList.forEach(s => (s.episodes || []).forEach(ep => {
        aRows.push(`<div class="comment-item" style="display:flex;justify-content:space-between;align-items:center;"><span>🎬 ${s.title} S${ep.season} Ep${ep.epNum}</span><span class="tag">🌐 ${ep.lang || 'Hindi'}</span></div>`);
      }));
      const all = [...aRows, ...mRows];
      box.innerHTML = all.length ? all.join('') : `<p style="font-size:12px; color:var(--muted);">अभी कोई मंगा या एनिमे अपलोड नहीं हुआ है।</p>`;
    }

    function saveProfileName() {
      const val = document.getElementById('editNameInput').value.trim();
      if (!val) return;
      playSound('like'); userName = val; localStorage.setItem('m99_username', userName);
      document.getElementById('editNameInput').value = ''; updateProfileUI(); showToast('Saved!');
    }

    function toggleButtonSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('m99_sound', soundEnabled ? 'on' : 'off');
      updateProfileUI(); if (soundEnabled) playSound('like');
    }

    async function shareAppWithFriends() {
      const shareData = { title: 'Manga 99', text: 'अपनी मंगा अपलोड करो और हिंदी/इंग्लिश एनिमे देखो Manga 99 पर:', url: window.location.href };
      try {
        if (navigator.share) await navigator.share(shareData);
        else { await navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`); showToast('Link Copied! 📋'); }
      } catch (e) {}
    }

    function checkPromoCode() {
      const code = document.getElementById('promoCodeInput').value.trim();
      document.getElementById('promoCodeInput').value = '';
      if (code === '2010') { playSound('play'); renderAdminEpisodes(); switchView('admin'); }
      else { playSound('back'); showToast('Invalid Code!'); }
    }

    async function adminPublishEpisode() {
      const sTitle = document.getElementById('admSeriesTitle').value.trim();
      const season = Number(document.getElementById('admSeason').value) || 1;
      const epNum = Number(document.getElementById('admEpNum').value) || 1;
      const lang = document.getElementById('admLang').value || 'Hindi';
      const epTitle = document.getElementById('admEpTitle').value.trim() || `Episode ${epNum}`;
      const url = document.getElementById('admVideoUrl').value.trim();
      const posterFile = document.getElementById('admPoster').files[0];
      if (!sTitle || !url) { showToast('सीरीज़ का नाम और .mp4 लिंक डालें!'); return; }
      playSound('play'); showToast('सेव हो रहा है...');

      let series = animeList.find(a => a.title.toLowerCase() === sTitle.toLowerCase());
      let poster = series ? series.poster : '';
      if (posterFile) poster = await compressImage(posterFile, 450, 0.72);
      if (!series) { series = { id: 's_' + Date.now(), title: sTitle, poster, episodes: [] }; animeList.unshift(series); }
      else if (poster) series.poster = poster;

      series.episodes.push({ id: 'ep_' + Date.now(), season, epNum, lang, title: epTitle, url });
      await saveAnimeCloud();
      document.getElementById('admEpTitle').value = ''; document.getElementById('admVideoUrl').value = '';
      renderAdminEpisodes(); renderAnimeList(); updateProfileUI();
      showToast('एपिसोड सेव हो गया! ✅');
    }

    function renderAdminEpisodes() {
      const box = document.getElementById('adminEpisodeList');
      if (!animeList.length) { box.innerHTML = `<p style="font-size:12px; color:var(--muted);">No episodes yet.</p>`; return; }
      box.innerHTML = animeList.map(s => `
        <div style="background:var(--card2); padding:10px; border-radius:10px; margin-bottom:8px;">
          <div style="font-weight:700; font-size:13px; margin-bottom:6px;">${s.title} (${s.episodes.length} Eps)</div>
          ${s.episodes.map(ep => `
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 0; border-top:1px solid var(--border);">
              <span>S${ep.season} Ep${ep.epNum} [${ep.lang || 'Hindi'}]</span>
              <button class="btn btn-dark btn-sm" style="color:#f87171;" onclick="deleteAdminEpisode('${s.id}','${ep.id}')">हटाएं</button>
            </div>`).join('')}
        </div>`).join('');
    }

    async function deleteAdminEpisode(sId, epId) {
      playSound('back');
      const s = animeList.find(a => a.id === sId);
      if (!s) return;
      s.episodes = s.episodes.filter(e => e.id !== epId);
      if (!s.episodes.length) animeList = animeList.filter(a => a.id !== sId);
      await saveAnimeCloud(); renderAdminEpisodes(); renderAnimeList(); updateProfileUI();
      showToast('Deleted.');
    }
  </script>
</body>
</html>
