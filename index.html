<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <meta name="theme-color" content="#09090b" />

  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #09090b; color: #fafafa; font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior-y: none; user-select: none; }
    input, textarea, select { user-select: text; }

    .glass-bar { background: rgba(9, 9, 11, 0.92); backdrop-filter: blur(16px); border-color: #27272a; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    @keyframes logoZoom { 0% { transform: scale(0.75); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes barLoad { 0% { width: 0%; } 100% { width: 100%; } }
    .splash-logo { animation: logoZoom 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .splash-bar { animation: barLoad 2.3s ease-in-out forwards; }
  </style>
</head>
<body class="min-h-screen pb-24">

  </div>

  <!-- TOP HEADER -->
  <header class="glass-bar sticky top-0 z-40 border-b px-4 py-3">
    <div class="max-w-3xl mx-auto flex items-center justify-between">

        <div>
          <span class="brand-font text-2xl leading-none tracking-wider block">MANGA <span class="text-red-500">99</span></span>

      <div class="flex items-center gap-2">
        <button onclick="playStartupSound(); fetchLiveManga(true);" class="p-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 active:scale-90 transition" title="Sync Live">

  <main class="max-w-3xl mx-auto px-4 pt-4">

      <div id="genreChips" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>

    </section>
        <!-- SEARCH VIEW -->
    <section id="view-search" class="hidden space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>

    <!-- PUBLISH / UPLOAD VIEW -->

          <button type="button" id="modeChapBtn" onclick="setPublishMode('chapter')" class="flex-1 py-2 rounded-lg text-xs font-bold text-zinc-400">Add Chapter</button>

        <form id="newMangaForm" onsubmit="publishNewManga(event)" class="space-y-3.5">
          <div>
            <label class="text-xs font-semibold text-zinc-300">Manga Title *</label>
            <input id="mTitle" required placeholder="e.g. Solo Leveling: Rise" class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-red-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-zinc-300">Author / Creator *</label>
              <input id="mAuthor" required placeholder="e.g. Abhay" class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-red-500 focus:outline-none">
            </div>
            <div>
              <label class="text-xs font-semibold text-zinc-300">Genre</label>
              <select id="mGenre" class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm">
                <option>Action</option><option>Fantasy</option><option>Romance</option><option>Thriller</option><option>Sci-Fi</option>
              </select>

          </div>
          <div>
            <label class="text-xs font-semibold text-zinc-300">Story Description</label>
            <textarea id="mDesc" rows="2" placeholder="Write a short summary..." class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm focus:border-red-500 focus:outline-none"></textarea>

          <div>
            <label class="text-xs font-semibold text-zinc-300">Cover Image *</label>

        <form id="addChapterForm" onsubmit="publishNewChapter(event)" class="hidden space-y-3.5">

            <label class="text-xs font-semibold text-zinc-300">Select Manga *</label>
            <select id="targetMangaSelect" class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-zinc-300">Chapter Name / Number *</label>
            <input id="cTitle" required placeholder="e.g. Chapter 2: Awakening" class="mt-1 w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm">
          </div>
          <div>
            <label class="text-xs font-semibold text-zinc-300">Chapter Pages (Select Multiple Photos) *</label>
            <input id="cPages" type="file" accept="image/*" multiple required class="mt-1 w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border-0 file:bg-red-600 file:text-white file:font-bold">
          </div>
          <button id="pubBtn2" type="submit" class="w-full bg-red-600 text-white font-extrabold py-3 rounded-xl">
            Upload Chapter Live
          </button>
        </form>
      </div>
    </section>

    <!-- LIBRARY VIEW -->
    <section id="view-library" class="hidden space-y-4">

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 inset-x-0 glass-bar border-t z-40">

      <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-0.5 text-red-500">
        <i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold">Home</span>
      </button>
      <button onclick="switchTab('search')" id="nav-search" class="flex flex-col items-center gap-0.5 text-zinc-400">
        <i data-lucide="search" class="w-5 h-5"></i><span class="text-[10px] font-bold">Search</span>
      </button>
      <button onclick="switchTab('publish')" id="nav-publish" class="flex flex-col items-center gap-0.5 text-zinc-400">
        <i data-lucide="plus-circle" class="w-5 h-5"></i><span class="text-[10px] font-bold">Publish</span>
      </button>
      <button onclick="switchTab('library')" id="nav-library" class="flex flex-col items-center gap-0.5 text-zinc-400">
        <i data-lucide="bookmark" class="w-5 h-5"></i><span class="text-[10px] font-bold">Library</span>
      </button>
    </div>
  </nav>
    <script>
    let startupPlayed = false;

    // Crunchyroll-Inspired Cinematic Startup Chime (Web Audio API - Zero External File Needed)
    function playStartupSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5 Rich Chord
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = i === 3 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);

          gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + i * 0.09 + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.09 + 1.1);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 1.15);
        });
        startupPlayed = true;
      } catch (e) { console.log(e); }
    }

    function triggerStartupAudio() {
      if (!startupPlayed) playStartupSound();
    }

    function finishSplash() {
      const sp = document.getElementById('splashScreen');
      if (!sp || sp.dataset.done) return;
      sp.dataset.done = '1';
      sp.style.opacity = '0';
      setTimeout(() => sp.classList.add('hidden'), 500);
    }

    // Play sound automatically if allowed, or on first screen touch
    window.addEventListener('DOMContentLoaded', () => {
      playStartupSound();
      setTimeout(finishSplash, 2400);
    });
    document.addEventListener('touchstart', triggerStartupAudio, { once: true });
    document.addEventListener('click', triggerStartupAudio, { once: true });

    const LIVE_DB_URL = "https://getpantry.cloud/apiv1/pantry/ab292eec-a5da-494c-a7cb-acebf987fda2/basket/manga99_classic";

    const svgCover = (bg, title, sub) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="850"><rect width="100%" height="100%" fill="${bg}"/><rect x="24" y="24" width="552" height="802" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4"/><text x="300" y="390" font-family="sans-serif" font-size="40" font-weight="900" fill="white" text-anchor="middle">${title}</text><text x="300" y="450" font-family="sans-serif" font-size="20" fill="#e4e4e7" text-anchor="middle">${sub}</text></svg>`);

    const DEFAULT_MANGA = [
      {
        id: 'm1',
        title: 'Shadow Monarch',
        author: 'Abhay (Creator)',
        genre: 'Action',
        desc: 'Ek kamzor hunter jise ek gupt system milta hai aur woh sabse taqatwar monarch banta hai.',
        cover: svgCover('#7f1d1d', 'SHADOW MONARCH', 'MANGA 99 ORIGINAL'),
        chapters: [
          {
            id: 'c1',
            title: 'Chapter 1: The Awakening',
            date: 'Today',
            pages: [
              svgCover('#18181b', 'CHAPTER 1 - PAGE 1', 'Dungeon Gate Opened!'),
              svgCover('#450a0a', 'CHAPTER 1 - PAGE 2', 'System Quest Accepted.')
            ]
          }
        ]
      },
      {
        id: 'm2',
        title: 'Crimson Blade',
        author: 'Aoi Tanaka',
        genre: 'Fantasy',
        desc: 'Laal chand ki raat mein shuru hoti ek shrapit talwar ki kahani.',
        cover: svgCover('#3b0764', 'CRIMSON BLADE', 'DARK FANTASY'),
        chapters: [
          {
            id: 'c201',
            title: 'Chapter 1: Blood Moon',
            date: 'Today',
            pages: [svgCover('#1e1b4b', 'CHAPTER 1 - PAGE 1', 'The Cursed Katana')]
          }
        ]
      }
    ];

    let mangaList = JSON.parse(localStorage.getItem('m99_classic_data')) || DEFAULT_MANGA;
    let bookmarkedIds = JSON.parse(localStorage.getItem('m99_bookmarks')) || [];
    let selectedGenre = 'All';

    function updateStatus(text, colorClass) {
      const el = document.getElementById('cloudStatus');
      if (el) { el.innerText = text; el.className = `block text-[9px] font-bold uppercase tracking-widest ${colorClass}`; }
    }
        async function fetchLiveManga(showAlert = false) {
      updateStatus('Syncing...', 'text-amber-400');
      try {
        const res = await fetch(LIVE_DB_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.manga) && data.manga.length > 0) {
            mangaList = data.manga;
            localStorage.setItem('m99_classic_data', JSON.stringify(mangaList));
          } else {
            await pushLiveManga();
          }
          updateStatus('Live Cloud ✓', 'text-emerald-400');
          renderHome();
          if (showAlert) alert('Live Manga Library Updated!');
        } else {
          await pushLiveManga();
          renderHome();
        }
      } catch (e) {
        await pushLiveManga();
        renderHome();
      }
    }

    async function pushLiveManga() {
      updateStatus('Uploading...', 'text-amber-400');
      localStorage.setItem('m99_classic_data', JSON.stringify(mangaList));
      try {
        const res = await fetch(LIVE_DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ manga: mangaList })
        });
        if (res.ok) {
          updateStatus('Live Cloud ✓', 'text-emerald-400');
          return true;
        }
      } catch (e) { console.error(e); }
      updateStatus('Saved Offline', 'text-zinc-400');
      return true;
    }

    const compressImg = file => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 600;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
        function switchTab(tab) {
      ['home', 'search', 'publish', 'library', 'admin'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        const navBtn = document.getElementById('nav-' + t);
        if (navBtn) navBtn.className = `flex flex-col items-center gap-0.5 ${t === tab ? 'text-red-500' : 'text-zinc-400'}`;
      });
      document.getElementById('view-' + tab).classList.remove('hidden');
      if (tab === 'home') renderHome();
      if (tab === 'search') renderSearch();
      if (tab === 'publish') populateMangaDropdown();
      if (tab === 'library') renderLibrary();
      if (tab === 'admin') renderAdmin();
      window.scrollTo(0, 0);
    }

    function cardTemplate(m) {
      return `
      <div onclick="openMangaDetail('${m.id}')" class="manga-card bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden cursor-pointer transition">
        <div class="relative aspect-[3/4] bg-zinc-950">
          <img src="${m.cover}" class="w-full h-full object-cover">
          <span class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md">${m.genre}</span>
          <span class="absolute bottom-2 right-2 bg-black/80 text-zinc-200 text-[10px] font-bold px-2 py-0.5 rounded-md">${m.chapters.length} Ch</span>
        </div>
        <div class="p-2.5">
          <h3 class="text-xs font-extrabold text-white truncate">${m.title}</h3>
          <p class="text-[11px] text-zinc-400 truncate mt-0.5">by ${m.author}</p>
        </div>
      </div>`;
    }

    function renderHome() {
      const top = mangaList[0];
      if (top) {
        document.getElementById('heroBanner').onclick = () => openMangaDetail(top.id);
        document.getElementById('heroBanner').innerHTML = `
          <img src="${top.cover}" class="absolute inset-0 w-full h-full object-cover opacity-45">
          <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
          <div class="relative z-10 space-y-1">
            <span class="bg-red-600 text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full">Featured Release</span>
            <h1 class="text-xl font-black text-white">${top.title}</h1>
            <p class="text-xs text-zinc-300 line-clamp-1">${top.desc || 'Tap to read chapters now'}</p>
          </div>`;
      }

      const genres = ['All', 'Action', 'Fantasy', 'Romance', 'Thriller', 'Sci-Fi'];
      document.getElementById('genreChips').innerHTML = genres.map(g => `
        <button onclick="selectedGenre='${g}';renderHome()" class="px-3.5 py-1.5 rounded-full text-xs font-bold shrink-0 ${selectedGenre === g ? 'bg-red-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-400'}">${g}</button>

    function playProAnimeSound(type = 'startup') {
      if (m99SoundMuted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        if (type === 'startup') {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(110, now);
          osc1.frequency.exponentialRampToValueAtTime(220, now + 0.55);
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(440, now + 0.15);
          osc2.frequency.exponentialRampToValueAtTime(880, now + 0.75);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.2);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
          osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
          osc1.start(now); osc2.start(now + 0.15);
          osc1.stop(now + 1.15); osc2.stop(now + 1.15);
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        }
      } catch (e) {}
    }

    async function getAllUsersSafe() {
      let localUsers = JSON.parse(localStorage.getItem('m99_local_users') || '[]');
      try {
        const res = await fetch(USERS_DB_URL);
        if (res.ok) {
          const d = await res.json();
          if (Array.isArray(d.users)) {
            const merged = [...d.users];
            localUsers.forEach(lu => {
              if (!merged.some(mu => mu.name.toLowerCase() === lu.name.toLowerCase())) merged.push(lu);
            });
            localStorage.setItem('m99_local_users', JSON.stringify(merged));
            return merged;
          }
        }
      } catch (e) {}
      return localUsers;
    }

    async function submitSignup() {
      const name = document.getElementById('signupName').value.trim();
      const pass = document.getElementById('signupPass').value.trim();
      const avatarFile = document.getElementById('signupAvatar').files[0];
      if (!name || !pass) return showAppToast('कृपया नाम और पासवर्ड दोनों लिखें!', true);
      if (name.toLowerCase() === 'guest') return showAppToast('Guest नाम नहीं रख सकते!', true);

      const btn = document.getElementById('signupBtn');
      btn.disabled = true; btn.innerText = 'Creating...';
      try {
        const users = await getAllUsersSafe();
        if (users.some(u => u.name.toLowerCase() === name.toLowerCase())) {
          showAppToast('यह नाम पहले से लिया जा चुका है, दूसरा नाम चुनें!', true);
          return;
        }
        let avatar = '';
        if (avatarFile) {
          try { avatar = await compressImg(avatarFile); } catch (e) {}
        }
        const newUserObj = { name, pass, bio: 'Manga & Anime Fan on Manga 99', avatar };
        users.push(newUserObj);
        localStorage.setItem('m99_local_users', JSON.stringify(users));
        try {
          await fetch(USERS_DB_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ users })
          });
        } catch (e) {}

        activeUser = { name, bio: newUserObj.bio, avatar, isGuest: false };
        localStorage.setItem('m99_user', JSON.stringify(activeUser));
        document.getElementById('crAuthOverlay').classList.add('hidden');
        refreshHeaderUserUI();

    async function saveInstaProfile() {
      const newName = document.getElementById('editNameInp').value.trim();
      const newBio = document.getElementById('editBioInp').value.trim();
      const file = document.getElementById('editAvatarFile').files[0];
      if (!newName) return showAppToast('नाम खाली नहीं छोड़ सकते!', true);

      const btn = document.getElementById('saveProfileBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      try {
        const oldName = activeUser.name;
        let avatar = activeUser.avatar || '';
        if (file) avatar = await compressImg(file);

        const users = await getAllUsersSafe();
        const idx = users.findIndex(x => x.name.toLowerCase() === oldName.toLowerCase());
        if (idx > -1) {
          users[idx].name = newName;
          users[idx].bio = newBio;
          users[idx].avatar = avatar;
          localStorage.setItem('m99_local_users', JSON.stringify(users));
          try {
            await fetch(USERS_DB_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ users })
            });
          } catch (e) {}
        }

        let changed = false;
        mangaList.forEach(m => {
          if (m.author && m.author.toLowerCase() === oldName.toLowerCase()) {
            m.author = newName;
            changed = true;
          }
        });

        activeUser = { ...activeUser, name: newName, bio: newBio, avatar };
        localStorage.setItem('m99_user', JSON.stringify(activeUser));

        if (changed) {
          await pushLiveManga();
          renderHome();
        }
        refreshHeaderUserUI();
        openInstaProfile(newName);
        pingOnlineStatus();
        document.getElementById('editProfilePanel').classList.add('hidden');
        showAppToast('प्रोफाइल अपडेट हो गई!');
      } finally {
        btn.disabled = false; btn.innerText = 'Save Profile Changes';
      }
    }

      const target = mangaList.find(m => m.id === id);
      if (!target || target.author.toLowerCase() !== activeUser.name.toLowerCase()) return;
      mangaList = mangaList.filter(m => m.id !== id);
      openInstaProfile(activeUser.name);
      renderHome();
      await pushLiveManga();
      showAppToast('आपकी Manga डिलीट कर दी गई!');
    }

    async function toggleMangaLike(mangaId, e) {
      if (e) e.stopPropagation();
      const userKey = (activeUser && !activeUser.isGuest) ? activeUser.name : ('guest_' + (localStorage.getItem('m99_gid') || (() => { const g = Date.now(); localStorage.setItem('m99_gid', g); return g; })()));
      if (!socialData.likes[mangaId]) socialData.likes[mangaId] = [];

      const idx = socialData.likes[mangaId].indexOf(userKey);
      if (idx > -1) {
        socialData.likes[mangaId].splice(idx, 1);
      } else {
        socialData.likes[mangaId].push(userKey);
        playProAnimeSound('click');
      }
      renderHome();
      await syncSocialCloud(true);
    }

        <div class="p-3 bg-zinc-900 border-t border-zinc-800 flex gap-2">
          <input id="chatMsgInput" type="text" placeholder="पर्सनल मैसेज लिखें..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:border-orange-500 focus:outline-none">
          <button onclick="sendChatMessage()" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-red-600 text-xs font-extrabold text-white">Send</button>
        </div>
      `;
      document.body.appendChild(cm);
    }

    async function openChatHub() {
      if (!activeUser || activeUser.isGuest || activeUser.name === 'Guest') {
        showAppToast('पर्सनल चैट करने के लिए पहले Create Account या Log In करें!', true);
        openWelcomeAuthScreen();
        return;
      }
      buildChatHubModal();
      document.getElementById('chatHubModal').classList.remove('hidden');
      await syncSocialCloud(false);
      await pingOnlineStatus();
      await renderChatLists();
    }

    function closeChatHub() {
      document.getElementById('chatHubModal').classList.add('hidden');
    }

    async function openPersonalChatWith(userName) {
      await openChatHub();
      selectPersonalChat(userName);
    }

    async function renderChatLists() {
      const users = await getAllUsersSafe();
      const others = users.filter(u => u.name.toLowerCase() !== activeUser.name.toLowerCase());
      const uRow = document.getElementById('activeUsersRow');

      uRow.innerHTML = others.length
        ? others.map(u => {
            const on = isUserOnline(u.name);
            return `
              <div onclick="selectPersonalChat('${u.name}')" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">
                <div class="relative">
                  <div class="w-11 h-11 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-black text-white overflow-hidden">
                    ${u.avatar ? `<img src="${u.avatar}" class="w-full h-full object-cover">` : u.name.charAt(0).toUpperCase()}
                  </div>
                  ${on ? '<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-emerald-500 border-2 border-zinc-950"></span>' : ''}
                </div>
                <span class="text-[10px] font-bold text-zinc-300 max-w-[54px] truncate">${u.name}</span>
              </div>
            `;
          }).join('')
        : '<p class="text-[11px] text-zinc-500">अभी कोई अन्य यूज़र रजिस्टर्ड नहीं है।</p>';

      if (!currentChatUser && others.length > 0) {
        selectPersonalChat(others[0].name);
      } else {
        renderChatMessages();
      }
    }

    function selectPersonalChat(targetName) {
      currentChatUser = targetName;
      const onBadge = isUserOnline(targetName) ? ' • 🟢 Online' : '';
      document.getElementById('chatRoomTitle').innerText = targetName + onBadge;
      renderChatMessages();
    }

    function renderChatMessages() {
      const box = document.getElementById('chatMessagesBox');
      if (!box) return;
      if (!currentChatUser) {
        box.innerHTML = '<p class="text-xs text-zinc-500 text-center py-10">पर्सनल चैट शुरू करने के लिए ऊपर किसी यूज़र की फोटो पर टैप करें।</p>';
        return;
      }
      const filtered = socialData.messages.filter(m =>
        (m.from === activeUser.name && m.to === currentChatUser) ||
        (m.from === currentChatUser && m.to === activeUser.name)
      );

      box.innerHTML = filtered.length
        ? filtered.map(m => {
            const isMe = m.from === activeUser.name;
            return `
              <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                <span class="text-[9px] text-zinc-500 mb-0.5 px-1">${m.time}</span>
                <div class="max-w-[78%] px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-gradient-to-r from-orange-500 to-red-600 text-white rounded-br-none' : 'bg-zinc-900 border border-zinc-800 text-zinc-200 rounded-bl-none'}">
                  ${m.text}
                </div>
              </div>
            `;
          }).join('')
        : `<p class="text-xs text-zinc-500 text-center py-10">${currentChatUser} को पहला पर्सनल मैसेज भेजें!</p>`;
      box.scrollTop = box.scrollHeight;
    }

    async function sendChatMessage() {
      const inp = document.getElementById('chatMsgInput');
      const text = inp.value.trim();
      if (!text || !currentChatUser) return;
      inp.value = '';

      socialData.messages.push({
        from: activeUser.name,
        to: currentChatUser,
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      if (socialData.messages.length > 100) socialData.messages = socialData.messages.slice(-100);
      renderChatMessages();
      playProAnimeSound('click');
      await syncSocialCloud(true);
    }

    async function refreshChatMessages() {
      await syncSocialCloud(false);
      await pingOnlineStatus();
      await renderChatLists();
      showAppToast('Messages Updated');
    }

    // केवल Admin Panel के अंदर Anime Episodes अपलोड और डिलीट करने का सिस्टम
    function renderAdmin() {
      const adminContainer = document.getElementById('adminMangaList');
      if (!adminContainer) return;

      adminContainer.innerHTML = `
        <div class="bg-zinc-900 border border-orange-500/40 rounded-2xl p-4 mb-5 space-y-3">
          <h3 class="text-xs font-black uppercase tracking-wider text-orange-400">🎬 Admin Only: Upload Hindi Anime Episode</h3>
          <input id="admAnimeSeries" type="text" placeholder="Anime Series का नाम (जैसे Attack on Titan)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white">
          <input id="admAnimeTitle" type="text" placeholder="Episode नाम (जैसे Episode 1 Hindi Dub)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white">
          <input id="admAnimeLink" type="url" placeholder="Video Link (.mp4 / Google Drive / Embed URL)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white">
          <div>
            <label class="block text-[10px] text-zinc-400 mb-1">Episode Thumbnail फोटो चुनें:</label>
            <input id="admAnimeThumb" type="file" accept="image/*" class="w-full text-[11px] text-zinc-300">
          </div>
          <button id="admPublishAnimeBtn" onclick="adminPublishAnime()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-orange-500 to-red-600 text-xs font-extrabold text-white">
            Publish Anime Episode Live
          </button>

          <div class="pt-2 border-t border-zinc-800 space-y-2">
            <p class="text-[10px] font-bold text-zinc-400 uppercase">Published Anime Episodes (${socialData.anime.length})</p>
            ${socialData.anime.map(a => `
              <div class="flex items-center justify-between bg-zinc-950 border border-zinc-800 p-2.5 rounded-xl text-xs">
                <div class="min-w-0 pr-2">
                  <p class="font-bold text-white truncate">${a.title}</p>
                  <p class="text-[10px] text-zinc-400 truncate">${a.series || 'Hindi Dub'}</p>
                </div>
                <button onclick="adminDeleteAnime('${a.id}')" class="bg-red-600 px-2.5 py-1 rounded-lg font-bold text-[11px] shrink-0">Delete</button>
              </div>
            `).join('') || '<p class="text-[11px] text-zinc-500">कोई एनिमे एपिसोड अपलोड नहीं है।</p>'}
          </div>
        </div>

        <h3 class="text-xs font-black uppercase tracking-wider text-zinc-400 mb-2">Manage Manga Series</h3>
        <div class="space-y-2">
          ${mangaList.map(m => `
            <div class="flex items-center justify-between bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-xs">
              <div><p class="font-bold text-white">${m.title}</p><p class="text-[10px] text-zinc-400">by ${m.author} • ${m.chapters.length} Chapters</p></div>
              <button onclick="deleteMangaLive('${m.id}')" class="bg-red-600 px-3 py-1.5 rounded-lg font-bold">Delete</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function adminPublishAnime() {
      const series = document.getElementById('admAnimeSeries').value.trim() || 'Hindi Dubbed Anime';
      const title = document.getElementById('admAnimeTitle').value.trim();
      let link = document.getElementById('admAnimeLink').value.trim();
      const thumbFile = document.getElementById('admAnimeThumb').files[0];
      if (!title || !link || !thumbFile) return showAppToast('कृपया नाम, वीडियो लिंक और थंबनेल फोटो तीनों डालें!', true);

      if (link.includes('drive.google.com') && link.includes('/view')) {
        link = link.replace('/view', '/preview');
      }

      const btn = document.getElementById('admPublishAnimeBtn');
      btn.disabled = true; btn.innerText = 'Uploading Anime...';
      try {
        const cover = await compressImg(thumbFile);
        socialData.anime.unshift({ id: 'an_' + Date.now(), series, title, link, cover });
        await syncSocialCloud(true);
        renderAdmin();
        renderAnimeLibraryGrid();
        showAppToast('Anime Episode लाइव हो गया!');
      } finally {
        btn.disabled = false; btn.innerText = 'Publish Anime Episode Live';
      }
    }

    async function adminDeleteAnime(id) {
      socialData.anime = socialData.anime.filter(a => a.id !== id);
      renderAdmin();
      renderAnimeLibraryGrid();
      await syncSocialCloud(true);
      showAppToast('Anime Episode डिलीट हो गया');
    }

    // मूल Publish, Search, Admin PIN व Cloud Sync
    function setPublishMode(mode) {
      const isNew = mode === 'new';
      document.getElementById('newMangaForm').classList.toggle('hidden', !isNew);
      document.getElementById('addChapterForm').classList.toggle('hidden', isNew);
      document.getElementById('modeNewBtn').className = `flex-1 py-2 rounded-lg text-xs font-bold ${isNew ? 'bg-red-600 text-white' : 'text-zinc-400'}`;
      document.getElementById('modeChapBtn').className = `flex-1 py-2 rounded-lg text-xs font-bold ${!isNew ? 'bg-red-600 text-white' : 'text-zinc-400'}`;
      if (!isNew) populateMangaDropdown();
    }

    function populateMangaDropdown() {
      document.getElementById('targetMangaSelect').innerHTML = mangaList.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
    }

    async function publishNewManga(e) {
      e.preventDefault();
      const btn = document.getElementById('pubBtn1');
      btn.disabled = true; btn.innerText = 'Publishing Live...';
      try {
        const coverFile = document.getElementById('mCover').files[0];
        const pageFiles = Array.from(document.getElementById('mPages').files);
        const cover = await compressImg(coverFile);
        const pages = await Promise.all(pageFiles.map(f => compressImg(f)));

        mangaList.unshift({
          id: 'm' + Date.now(),
          title: document.getElementById('mTitle').value.trim(),
          author: document.getElementById('mAuthor').value.trim(),
          genre: document.getElementById('mGenre').value,
          desc: document.getElementById('mDesc').value.trim(),
          cover,
          chapters: [{ id: 'c' + Date.now(), title: 'Chapter 1', date: 'Just now', pages }]
        });
        await pushLiveManga();
        e.target.reset();
        refreshHeaderUserUI();
        showAppToast('Manga Published Live!');
        switchTab('home');
      } finally {
        btn.disabled = false; btn.innerText = 'Publish Manga Live';
      }
    }

    async function publishNewChapter(e) {
      e.preventDefault();
      const btn = document.getElementById('pubBtn2');
      btn.disabled = true; btn.innerText = 'Uploading Chapter...';
      try {
        const mId = document.getElementById('targetMangaSelect').value;
        const m = mangaList.find(x => x.id === mId);
        if (!m) return;
        const pageFiles = Array.from(document.getElementById('cPages').files);
        const pages = await Promise.all(pageFiles.map(f => compressImg(f)));
        m.chapters.push({
          id: 'c' + Date.now(),
          title: document.getElementById('cTitle').value.trim(),
          date: 'Just now',
          pages
        });
        await pushLiveManga();
        e.target.reset();
        showAppToast('New Chapter Added Live!');
        switchTab('home');
      } finally {
        btn.disabled = false; btn.innerText = 'Upload Chapter Live';
      }
    }

    function toggleBookmark(id) {
      bookmarkedIds = bookmarkedIds.includes(id) ? bookmarkedIds.filter(x => x !== id) : [...bookmarkedIds, id];
      localStorage.setItem('m99_bookmarks', JSON.stringify(bookmarkedIds));
      openMangaDetail(id);
    }

    function renderSearch() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase();
      const res = mangaList.filter(m => m.title.toLowerCase().includes(q) || m.author.toLowerCase().includes(q) || m.genre.toLowerCase().includes(q));
      document.getElementById('searchResults').innerHTML = res.map(cardTemplate).join('');
    }

    function openAdminGate() {
      document.getElementById('pinInput').value = '';
      document.getElementById('pinModal').classList.remove('hidden');
    }

    function verifyAdminPin() {
      if (document.getElementById('pinInput').value === '2010') {
        document.getElementById('pinModal').classList.add('hidden');
        switchTab('admin');
      } else {
        showAppToast('Wrong Admin PIN!', true);
      }
    }

    async function deleteMangaLive(id) {
      mangaList = mangaList.filter(m => m.id !== id);
      renderAdmin();
      await pushLiveManga();
      showAppToast('Manga Deleted');
    }

    fetchLiveManga = async function(showToast = false) {
      updateStatus('Syncing...', 'text-amber-400');
      await syncSocialCloud(false);
      try {
        const res = await fetch(LIVE_DB_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.manga) && data.manga.length > 0) {
            mangaList = data.manga;
            localStorage.setItem('m99_classic_data', JSON.stringify(mangaList));
          } else {
            await pushLiveManga();
          }
          updateStatus('Live Cloud ✓', 'text-emerald-400');
          renderHome();
          renderAnimeLibraryGrid();
          if (showToast) showAppToast('Library Updated!');
        } else {
          await pushLiveManga();
          renderHome();
        }
      } catch (e) {
        await pushLiveManga();
        renderHome();
      }
    };

    // BOOT EVERYTHING
    buildAuthModals();
    buildHeaderAndProfileUI();
    buildAnimeLibraryAndPlayer();
    upgradeProSplash();
    fetchLiveManga(false);
    pingOnlineStatus();
    setInterval(pingOnlineStatus, 90000);
  </script>
</body>
</html>
