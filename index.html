<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Manga 99 — Live Social Manga Feed</title>
  <meta name="application-name" content="Manga 99" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #000000; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior-y: none; user-select: none; }
    input, textarea, select { user-select: text; }
    .brand-font { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em; }
    .glass-bar { background: rgba(10, 10, 12, 0.92); backdrop-filter: blur(16px); border-color: #1f1f23; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes heartPop { 0% { transform: scale(0); opacity: 0; } 50% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
    .heart-burst { animation: heartPop 0.7s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen pb-20">
  <!-- TOP HEADER -->
  <header class="glass-bar sticky top-0 z-40 border-b px-4 py-2.5">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div onclick="switchTab('feed')" class="flex items-center gap-2 cursor-pointer">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 via-red-600 to-purple-600 flex items-center justify-center font-black text-sm">99</div>
        <div>
          <span class="brand-font text-2xl leading-none tracking-wider">MANGA <span class="text-red-500">99</span></span>
          <span id="cloudStatus" class="block text-[9px] font-bold uppercase tracking-widest text-emerald-400">Live Online</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="fetchLivePosts(true)" class="p-2 rounded-full bg-zinc-900 text-zinc-300 active:scale-90 transition" title="Refresh Feed">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button onclick="openAdminGate()" class="px-2.5 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-400 text-[11px] font-bold flex items-center gap-1">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i> Admin
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER (MOBILE INSTAGRAM WIDTH) -->
  <main class="max-w-lg mx-auto">
    <!-- FEED VIEW -->
    <section id="view-feed" class="space-y-1">
      <!-- Genre Stories Row -->
      <div id="storyGenres" class="flex items-center gap-3 overflow-x-auto no-scrollbar px-3 py-3 border-b border-zinc-900"></div>

      <!-- Instagram Style Posts Stream -->
      <div id="instaFeedStream" class="divide-y divide-zinc-900"></div>
    </section>
        <!-- SEARCH VIEW -->
    <section id="view-search" class="hidden p-4 space-y-4">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input id="searchBox" oninput="renderSearchGrid()" type="text" placeholder="Search manga, creator, genre..."
          class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-500">
      </div>
      <div id="exploreGrid" class="grid grid-cols-3 gap-1"></div>
    </section>

    <!-- UPLOAD / PUBLISH VIEW -->
    <section id="view-upload" class="hidden p-4 space-y-5">
      <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-4">
        <h2 class="text-lg font-extrabold flex items-center gap-2">
          <i data-lucide="plus-square" class="w-5 h-5 text-red-500"></i> New Manga / Photo Post
        </h2>
        <p class="text-xs text-zinc-400">Aapki post turant sabhi users ke feed mein live dikhegi.</p>

        <form onsubmit="publishLivePost(event)" class="space-y-3.5">
          <div>
            <label class="text-xs font-semibold text-zinc-300">Creator Name *</label>
            <input id="postAuthor" required placeholder="e.g. Abhay" class="mt-1 w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-red-500 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-semibold text-zinc-300">Manga Title / Caption *</label>
            <input id="postTitle" required placeholder="e.g. Shadow Monarch Ep 1" class="mt-1 w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm focus:border-red-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-zinc-300">Genre</label>
              <select id="postGenre" class="mt-1 w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-sm">
                <option>Action</option><option>Fantasy</option><option>Romance</option><option>Thriller</option><option>Art</option>
              </select>
            </div>
            <div>
              <label class="text-xs font-semibold text-zinc-300">Select Photos (1 ya Zyada) *</label>
              <input id="postImages" type="file" accept="image/*" multiple required class="mt-1 w-full text-xs text-zinc-400 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-red-600 file:text-white file:font-bold">
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-zinc-300">Story / Description</label>
            <textarea id="postCaption" rows="2" placeholder="Kahani ya chapter ke baare mein likhein..." class="mt-1 w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm focus:border-red-500 focus:outline-none"></textarea>
          </div>
          <button id="publishSubmitBtn" type="submit" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-amber-500 text-white font-extrabold py-3 rounded-xl shadow-lg">
            Share Live to Everyone
          </button>
        </form>
      </div>
    </section>

    <!-- SAVED VIEW -->
    <section id="view-saved" class="hidden p-4 space-y-3">
      <h2 class="text-base font-bold flex items-center gap-2"><i data-lucide="bookmark" class="w-4 h-4 text-red-500"></i> Saved Posts</h2>
      <div id="savedGrid" class="grid grid-cols-3 gap-1"></div>
    </section>

    <!-- ADMIN VIEW (PIN: 2010) -->
    <section id="view-admin" class="hidden p-4 space-y-4">
      <div class="flex items-center justify-between bg-amber-500/10 border border-amber-500/30 p-3.5 rounded-2xl">
        <div>
          <p class="text-[10px] font-bold uppercase text-amber-400">Admin Panel (PIN: 2010)</p>
          <h2 class="text-base font-bold">Live Feed Control</h2>
        </div>
        <button onclick="switchTab('feed')" class="px-3 py-1.5 bg-red-600 rounded-lg text-xs font-bold">Exit</button>
      </div>
      <div id="adminList" class="space-y-2"></div>
    </section>
  </main>
    <!-- COMMENTS BOTTOM SHEET -->
  <div id="commentsModal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-end justify-center">
    <div class="bg-zinc-950 border-t border-zinc-800 w-full max-w-lg rounded-t-3xl p-4 space-y-3 max-h-[75vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-2.5">
        <h3 class="font-bold text-sm">Live Comments</h3>
        <button onclick="closeComments()" class="p-1 bg-zinc-900 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="commentsContainer" class="flex-1 overflow-y-auto space-y-2.5 text-xs py-1"></div>
      <form onsubmit="submitComment(event)" class="flex gap-2 pt-2 border-t border-zinc-800">
        <input id="newCommentText" required placeholder="Add a comment..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-full px-4 py-2 text-xs focus:outline-none">
        <button type="submit" class="bg-red-600 px-4 py-2 rounded-full text-xs font-bold">Post</button>
      </form>
    </div>
  </div>

  <!-- FULLSCREEN WEBTOON READER MODAL -->
  <div id="readerModal" class="fixed inset-0 z-50 hidden bg-black flex flex-col">
    <div class="glass-bar border-b px-4 py-2.5 flex items-center justify-between">
      <button onclick="document.getElementById('readerModal').classList.add('hidden')" class="flex items-center gap-1 text-xs font-bold bg-zinc-900 px-3 py-1.5 rounded-full">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
      </button>
      <p id="readerTitle" class="text-xs font-bold truncate max-w-[200px]"></p>
      <span id="readerCount" class="text-[11px] text-red-400 font-bold"></span>
    </div>
    <div id="readerScrollArea" class="flex-1 overflow-y-auto flex flex-col items-center bg-black"></div>
  </div>

  <!-- ADMIN PIN MODAL -->
  <div id="pinModal" class="fixed inset-0 z-50 hidden bg-black/85 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 max-w-xs w-full text-center space-y-4">
      <h3 class="font-bold text-base">Enter Admin PIN</h3>
      <input id="pinInput" type="password" maxlength="6" placeholder="••••" class="w-full text-center tracking-[0.5em] text-xl font-bold bg-black border border-zinc-800 rounded-xl py-3">
      <div class="flex gap-2">
        <button onclick="document.getElementById('pinModal').classList.add('hidden')" class="flex-1 py-2.5 rounded-xl bg-zinc-800 text-xs font-semibold">Cancel</button>
        <button onclick="checkAdminPin()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-black text-xs font-bold">Unlock</button>
      </div>
    </div>
  </div>

  <!-- INSTAGRAM STYLE BOTTOM NAV -->
  <nav class="fixed bottom-0 inset-x-0 glass-bar border-t z-40">
    <div class="max-w-lg mx-auto flex justify-around py-2.5">
      <button onclick="switchTab('feed')" class="text-white"><i data-lucide="home" class="w-6 h-6"></i></button>
      <button onclick="switchTab('search')" class="text-zinc-400"><i data-lucide="search" class="w-6 h-6"></i></button>
      <button onclick="switchTab('upload')" class="text-red-500"><i data-lucide="plus-square" class="w-6 h-6"></i></button>
      <button onclick="switchTab('saved')" class="text-zinc-400"><i data-lucide="bookmark" class="w-6 h-6"></i></button>
    </div>
  </nav>
    <script>
    const LIVE_DB_URL = "https://getpantry.cloud/apiv1/pantry/ab292eec-a5da-494c-a7cb-acebf987fda2/basket/manga99";

    const makeDemoImg = (bg, t1, t2) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="950"><rect width="100%" height="100%" fill="${bg}"/><rect x="30" y="30" width="740" height="890" fill="none" stroke="white" stroke-width="5"/><text x="400" y="440" font-family="sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle">${t1}</text><text x="400" y="510" font-family="sans-serif" font-size="24" fill="#e4e4e7" text-anchor="middle">${t2}</text></svg>`);

    const STARTER_POSTS = [
      {
        id: 'p1', author: 'Abhay (Creator)', title: 'Shadow Monarch: Episode 1', genre: 'Action',
        caption: 'Andhere se uthti ek nayi shakti! Read par tap karke poora chapter dekhein.',
        likes: 124, time: 'Just now',
        pages: [
          makeDemoImg('#7f1d1d', 'SHADOW MONARCH', 'MANGA 99 EXCLUSIVE - PAGE 1'),
          makeDemoImg('#18181b', 'CHAPTER 1 - PAGE 2', 'System Activated: Level 1!')
        ],
        comments: [{ user: 'Aryan', text: 'Bhai bilkul Instagram jaisa mast chal raha hai!' }]
      }
    ];

    let posts = JSON.parse(localStorage.getItem('m99_insta_posts')) || STARTER_POSTS;
    let likedIds = JSON.parse(localStorage.getItem('m99_liked')) || [];
    let savedIds = JSON.parse(localStorage.getItem('m99_saved')) || [];
    let currentFilter = 'All';
    let activeCommentPostId = null;

    function setStatus(txt, cls) {
      const el = document.getElementById('cloudStatus');
      if (el) { el.innerText = txt; el.className = `block text-[9px] font-bold uppercase tracking-widest ${cls}`; }
    }
        async function fetchLivePosts(notify = false) {
      setStatus('Syncing...', 'text-amber-400');
      try {
        const res = await fetch(LIVE_DB_URL);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.posts) && data.posts.length > 0) {
            posts = data.posts;
            localStorage.setItem('m99_insta_posts', JSON.stringify(posts));
          } else {
            await pushLivePosts();
          }
          setStatus('Live Online ✓', 'text-emerald-400');
          renderFeed();
          if (notify) alert('Live Feed Updated!');
        } else {
          await pushLivePosts();
          renderFeed();
        }
      } catch (e) {
        await pushLivePosts();
        renderFeed();
      }
    }

    async function pushLivePosts() {
      setStatus('Uploading...', 'text-amber-400');
      localStorage.setItem('m99_insta_posts', JSON.stringify(posts));
      try {
        const res = await fetch(LIVE_DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ posts })
        });
        if (res.ok) {
          setStatus('Live Online ✓', 'text-emerald-400');
          return true;
        }
      } catch (e) { console.error(e); }
      setStatus('Saved Local', 'text-zinc-400');
      return true;
    }

    const compressPhoto = file => new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const maxW = 600;
          const sc = img.width > maxW ? maxW / img.width : 1;
          c.width = img.width * sc; c.height = img.height * sc;
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.65));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });
        function switchTab(tab) {
      ['feed', 'search', 'upload', 'saved', 'admin'].forEach(t => document.getElementById('view-' + t).classList.add('hidden'));
      document.getElementById('view-' + tab).classList.remove('hidden');
      if (tab === 'feed') renderFeed();
      if (tab === 'search') renderSearchGrid();
      if (tab === 'saved') renderSavedGrid();
      if (tab === 'admin') renderAdminList();
      window.scrollTo(0, 0);
    }

    function renderFeed() {
      const genres = ['All', 'Action', 'Fantasy', 'Romance', 'Thriller', 'Art'];
      document.getElementById('storyGenres').innerHTML = genres.map(g => `
        <button onclick="currentFilter='${g}';renderFeed()" class="flex flex-col items-center gap-1 shrink-0">
          <div class="p-[2px] rounded-full ${currentFilter===g ? 'bg-gradient-to-tr from-amber-500 via-red-600 to-purple-600' : 'bg-zinc-800'}">
            <div class="w-14 h-14 rounded-full bg-zinc-950 flex items-center justify-center text-xs font-bold ${currentFilter===g ? 'text-white' : 'text-zinc-400'}">${g}</div>
          </div>
        </button>
      `).join('');

      const list = posts.filter(p => currentFilter === 'All' || p.genre === currentFilter);
      document.getElementById('instaFeedStream').innerHTML = list.map(p => {
        const isLiked = likedIds.includes(p.id);
        const isSaved = savedIds.includes(p.id);
        return `
        <article class="py-3 space-y-2.5">
          <!-- Post Header -->
          <div class="px-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center font-bold text-xs">${p.author[0].toUpperCase()}</div>
              <div class="leading-tight">
                <p class="text-xs font-bold text-white">${p.author}</p>
                <p class="text-[10px] text-zinc-400">${p.genre} • ${p.time || 'Live'}</p>
              </div>
            </div>
            <button onclick="openChapterReader('${p.id}')" class="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-[11px] font-bold">
              Read (${p.pages.length} Pages)
            </button>
          </div>

          <!-- Post Image (Double Tap to Like) -->
          <div ondblclick="doubleTapLike('${p.id}', this)" class="relative bg-zinc-950 w-full aspect-[4/5] overflow-hidden flex items-center justify-center">
            <img src="${p.pages[0]}" class="w-full h-full object-cover">
            ${p.pages.length > 1 ? `<span class="absolute top-3 right-3 bg-black/75 px-2.5 py-1 rounded-full text-[10px] font-bold">1 / ${p.pages.length}</span>` : ''}
            <div class="heart-overlay pointer-events-none absolute inset-0 flex items-center justify-center hidden">
              <i data-lucide="heart" class="w-20 h-20 text-red-500 fill-red-500"></i>
            </div>
          </div>

          <!-- Action Bar -->
          <div class="px-3 flex items-center justify-between pt-1">
            <div class="flex items-center gap-4">
              <button onclick="toggleLike('${p.id}')" class="active:scale-125 transition">
                <i data-lucide="heart" class="w-6 h-6 ${isLiked ? 'text-red-500 fill-red-500' : 'text-white'}"></i>
              </button>
              <button onclick="openComments('${p.id}')">
                <i data-lucide="message-circle" class="w-6 h-6 text-white"></i>
              </button>
              <button onclick="openChapterReader('${p.id}')">
                <i data-lucide="book-open" class="w-6 h-6 text-white"></i>
              </button>
            </div>
            <button onclick="toggleSave('${p.id}')">
              <i data-lucide="bookmark" class="w-6 h-6 ${isSaved ? 'text-amber-400 fill-amber-400' : 'text-white'}"></i>
            </button>
          </div>

          <!-- Likes & Caption -->
          <div class="px-3 space-y-1">
            <p class="text-xs font-bold">${p.likes.toLocaleString()} likes</p>
            <p class="text-xs text-zinc-200"><b class="text-white">${p.title}</b> — ${p.caption || ''}</p>
            <button onclick="openComments('${p.id}')" class="text-[11px] text-zinc-400 block">
              View all ${(p.comments || []).length} comments
            </button>
          </div>
        </article>`;
      }).join('');
      lucide.createIcons();
    }

    function doubleTapLike(id, box) {
      const ov = box.querySelector('.heart-overlay');
      ov.classList.remove('hidden');
      ov.classList.add('heart-burst');
      setTimeout(() => { ov.classList.add('hidden'); ov.classList.remove('heart-burst'); }, 700);
      if (!likedIds.includes(id)) toggleLike(id);
    }

    async function toggleLike(id) {
      const p = posts.find(x => x.id === id);
      if (!p) return;
      if (likedIds.includes(id)) {
        likedIds = likedIds.filter(x => x !== id);
        p.likes = Math.max(0, p.likes - 1);
      } else {
        likedIds.push(id);
        p.likes += 1;
      }
      localStorage.setItem('m99_liked', JSON.stringify(likedIds));
      renderFeed();
      await pushLivePosts();
    }

    function toggleSave(id) {
      savedIds = savedIds.includes(id) ? savedIds.filter(x => x !== id) : [...savedIds, id];
      localStorage.setItem('m99_saved', JSON.stringify(savedIds));
      renderFeed();
    }

    function openChapterReader(id) {
      const p = posts.find(x => x.id === id);
      if (!p) return;
      document.getElementById('readerTitle').innerText = p.title;
      document.getElementById('readerCount').innerText = `${p.pages.length} Pages`;
      document.getElementById('readerScrollArea').innerHTML = p.pages.map(img => `<img src="${img}" class="w-full max-w-lg block">`).join('');
      document.getElementById('readerModal').classList.remove('hidden');
      lucide.createIcons();
    }
        async function publishLivePost(e) {
      e.preventDefault();
      const btn = document.getElementById('publishSubmitBtn');
      btn.disabled = true; btn.innerText = 'Uploading Live...';
      try {
        const files = Array.from(document.getElementById('postImages').files);
        const pages = await Promise.all(files.map(f => compressPhoto(f)));
        const newPost = {
          id: 'p' + Date.now(),
          author: document.getElementById('postAuthor').value.trim(),
          title: document.getElementById('postTitle').value.trim(),
          genre: document.getElementById('postGenre').value,
          caption: document.getElementById('postCaption').value.trim(),
          likes: 1,
          time: 'Just now',
          pages,
          comments: []
        };
        posts.unshift(newPost);
        await pushLivePosts();
        e.target.reset();
        alert('Post Live ho gayi! Ab sabhi users ko dikhegi.');
        switchTab('feed');
      } finally {
        btn.disabled = false; btn.innerText = 'Share Live to Everyone';
      }
    }

    function openComments(id) {
      activeCommentPostId = id;
      const p = posts.find(x => x.id === id);
      document.getElementById('commentsContainer').innerHTML = (p.comments || []).map(c => `
        <div class="bg-zinc-900 p-2.5 rounded-xl"><b class="text-red-400">${c.user}:</b> ${c.text}</div>
      `).join('') || '<p class="text-zinc-500 text-center py-6">No comments yet. Be first!</p>';
      document.getElementById('commentsModal').classList.remove('hidden');
      lucide.createIcons();
    }
    function closeComments() { document.getElementById('commentsModal').classList.add('hidden'); }

    async function submitComment(e) {
      e.preventDefault();
      const inp = document.getElementById('newCommentText');
      const p = posts.find(x => x.id === activeCommentPostId);
      if (!p || !inp.value.trim()) return;
      if (!p.comments) p.comments = [];
      p.comments.push({ user: 'Reader', text: inp.value.trim() });
      inp.value = '';
      openComments(activeCommentPostId);
      renderFeed();
      await pushLivePosts();
    }

    function renderSearchGrid() {
      const q = (document.getElementById('searchBox').value || '').toLowerCase();
      const res = posts.filter(p => p.title.toLowerCase().includes(q) || p.author.toLowerCase().includes(q) || p.genre.toLowerCase().includes(q));
      document.getElementById('exploreGrid').innerHTML = res.map(p => `
        <div onclick="openChapterReader('${p.id}')" class="aspect-square bg-zinc-900 overflow-hidden cursor-pointer relative">
          <img src="${p.pages[0]}" class="w-full h-full object-cover">
        </div>
      `).join('');
    }

    function renderSavedGrid() {
      const list = posts.filter(p => savedIds.includes(p.id));
      document.getElementById('savedGrid').innerHTML = list.length ? list.map(p => `
        <div onclick="openChapterReader('${p.id}')" class="aspect-square bg-zinc-900 overflow-hidden cursor-pointer">
          <img src="${p.pages[0]}" class="w-full h-full object-cover">
        </div>
      `).join('') : '<p class="col-span-3 text-xs text-zinc-500 py-6 text-center">No saved posts yet.</p>';
    }

    function openAdminGate() {
      document.getElementById('pinInput').value = '';
      document.getElementById('pinModal').classList.remove('hidden');
    }
    function checkAdminPin() {
      if (document.getElementById('pinInput').value === '2010') {
        document.getElementById('pinModal').classList.add('hidden');
        switchTab('admin');
      } else { alert('Wrong PIN!'); }
    }
    function renderAdminList() {
      document.getElementById('adminList').innerHTML = posts.map(p => `
        <div class="flex items-center justify-between bg-zinc-900 p-3 rounded-xl text-xs">
          <div><p class="font-bold">${p.title}</p><p class="text-[10px] text-zinc-400">by ${p.author} • ${p.likes} likes</p></div>
          <button onclick="adminDeletePost('${p.id}')" class="bg-red-600 px-3 py-1 rounded-lg font-bold">Delete</button>
        </div>
      `).join('');
    }
    async function adminDeletePost(id) {
      if (confirm('Delete this post for everyone?')) {
        posts = posts.filter(p => p.id !== id);
        renderAdminList();
        await pushLivePosts();
      }
    }

    fetchLivePosts();
  </script>
</body>
</html>
